name: 아침 알림
on:
  schedule:
    - cron: "13 22 * * *"   # 매일 07:13 (한국 시간) 미리 시작 → 08:00까지 기다렸다 보냄
  workflow_dispatch: {}      # Actions 화면에서 "Run workflow"로 바로 테스트
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin
      - run: python morning.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WAIT_UNTIL: ${{ github.event_name == 'schedule' && '08:00' || '' }}
